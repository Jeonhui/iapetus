[package]
name = "iapetus-gateway"
description = "Relays a guest's screen to viewers (PRD §6.1 Stream Gateway, §19.6)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# §19.7 puts the Control Plane on axum + tokio; the gateway sits beside it and
# shares the stack rather than introducing a second one.
axum = { workspace = true, features = ["ws"] }
base64 = "0.23.1"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
iapetus-auth = { version = "0.1.0", path = "../iapetus-auth" }
iapetus-proto = { version = "0.1.0", path = "../iapetus-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tokio-stream.workspace = true
