[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iapetus"
version = "0.1.0"
description = "Python SDK for Iapetus — a persistent virtual desktop for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = "UNLICENSED"
# No runtime dependencies: the SDK uses only the standard library, so it
# installs anywhere Python does and adds nothing to an agent's environment.
dependencies = []

[project.urls]
Homepage = "https://github.com/Jeonhui/iapetus"

[tool.hatch.build.targets.wheel]
packages = ["iapetus"]
