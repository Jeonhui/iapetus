[workspace]
resolver = "2"
members = ["crates/iapetus-auth", "crates/iapetus-gateway", "crates/iapetus-proto", "crates/iapetusd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "UNLICENSED"
repository = "https://github.com/Jeonhui/iapetus"

[workspace.dependencies]
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false }
tokio-stream = "0.1"
axum = "0.8"
tokio-tungstenite = "0.24"
x11rb = { version = "0.13", default-features = false }

[profile.release]
# iapetusd ships inside customer images (PRD §19.1), so binary size and a
# predictable failure mode matter more than the last few percent of speed.
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
